name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    # The engine alone (pure C++): fast, on every push.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target analog_dsp_tests analog-render
      - name: Test
        run: ./build/analog_dsp_tests
      - name: Benchmark
        run: ./build/analog-render --benchmark --voices 16 --seconds 5

  plugin-macos:
    # The plugin as it ships (universal), its tests, ANDOR OSP's suite, and auval.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: brew install ninja
      - name: Configure
        run: cmake -B build-plugin -G Ninja -DCMAKE_BUILD_TYPE=Release -DOSP_BUILD_PLUGIN=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        id: build
        run: cmake --build build-plugin
      - name: Test (engine, product, ANDOR OSP, visual regressions)
        run: ctest --test-dir build-plugin --output-on-failure
      # The AU check and the test build follow every successful build, also when a test fails
      # (the job stays red then): a known intermittent macOS pixel difference in ANDOR Example's
      # regression (ANDOR OSP's andor-design-system/reports/validation.md) must not withhold
      # ANDOR Analog's download.
      - name: Validate ANDOR Analog AU
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build-plugin/osp/external-products/product/ANDOR_Analog_artefacts/Release/AU/ANDOR Analog.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Aanl Ospx
      - name: Package macOS test build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          out="ANDOR-Analog-macOS-test"
          mkdir -p "$out"
          art="build-plugin/osp/external-products/product/ANDOR_Analog_artefacts/Release"
          cp -R "$art/AU/ANDOR Analog.component" "$art/VST3/ANDOR Analog.vst3" "$out/"
          if [ -d "$art/Standalone/ANDOR Analog.app" ]; then cp -R "$art/Standalone/ANDOR Analog.app" "$out/"; fi
          cp packaging/macos-test/install.command packaging/macos-test/README.txt "$out/"
          chmod +x "$out/install.command"
          lipo -info "$out/ANDOR Analog.component/Contents/MacOS/ANDOR Analog"
          ditto -c -k --keepParent "$out" ANDOR-Analog-macOS-test.zip
      - name: Upload the macOS test build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ANDOR-Analog-macOS-test
          path: ANDOR-Analog-macOS-test.zip
      - name: Upload the visual regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: build-plugin/andor-visual-regression/
          if-no-files-found: ignore

  plugin-windows:
    # The Windows test build (64-bit, MSVC): VST3 and standalone (AU is macOS only), with the
    # engine's and the product's tests. (ANDOR OSP's own suites and the visual regressions,
    # whose references are made on Linux and macOS, run in the macOS job.)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies (SQLite for ANDOR OSP's Library, from vcpkg)
        run: vcpkg install sqlite3:x64-windows
      - name: Configure
        run: |
          toolchain="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake"
          cmake -B build-plugin -G "Visual Studio 17 2022" -A x64 -DOSP_BUILD_PLUGIN=ON "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
      - name: Build
        id: build
        run: cmake --build build-plugin --config Release --parallel --target ANDOR_Analog_All andor_analog_tests analog_dsp_tests
      - name: Test (engine, product)
        run: ctest --test-dir build-plugin -C Release --output-on-failure -R "^(analog_dsp_tests|andor_analog_tests)$"
      - name: Package Windows test build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          out="ANDOR-Analog-Windows-test"
          mkdir -p "$out"
          art="build-plugin/osp/external-products/product/ANDOR_Analog_artefacts/Release"
          cp -R "$art/VST3/ANDOR Analog.vst3" "$out/"
          if [ -f "$art/Standalone/ANDOR Analog.exe" ]; then cp "$art/Standalone/ANDOR Analog.exe" "$out/"; fi
          sed 's/$/\r/' packaging/windows-test/install.bat > "$out/Install.bat"
          sed 's/$/\r/' packaging/windows-test/README.txt > "$out/README.txt"
          ls -R "$out" | head -40
          7z a -tzip ANDOR-Analog-Windows-test.zip "$out" > /dev/null
      - name: Upload the Windows test build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ANDOR-Analog-Windows-test
          path: ANDOR-Analog-Windows-test.zip
